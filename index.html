<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vui Học - The Bilingual Language World</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- React & ReactDOM (UMD versions for browser) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel (to compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdfaf6;
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px), radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.15);
        }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // MODULE 1: DATABASES & CONSTANTS
        // ==========================================
        
        const UI_TEXT = {
            vi: {
                appTitle: 'Vui Học', appSub: 'Thế Giới Ngôn Ngữ',
                switchProfile: '⬅️ Đổi Hồ Sơ', settings: '⚙️ Cài Đặt',
                timerTitle: 'Hẹn Giờ Lượt Chơi', timerSub: 'Phiên chơi công bằng', btnStart: 'Bắt Đầu', btnPause: 'Tạm Dừng', btnResume: 'Tiếp Tục',
                games: { alpha: 'Bảng Chữ Cái', memory: 'Lật Hình Cặp', desc: 'Mô Tả Tranh', slice: 'Chém Từ HD', convo: 'Hội Thoại' },
                mapTitle: '📚 Bản Đồ Học Tập',
                exit: '⬅️ Thoát', next: 'Tiếp Theo ➡️',
                reportTitle: 'Hoàn Thành Cấp Độ!', reportStars: 'Sao nhận được:', reportWords: 'Từ vựng:',
                btnNewWords: '🔄 Học Thêm Từ Mới', btnNextLevel: '⬆️ Thử Cấp Tiếp Theo', btnHome: '🏠 Về Trang Chủ',
                memTitle: '🧠 Lật Hình Tìm Cặp', memPairs: 'Cặp', memWin: '🎉 Tuyệt Vời!', memRetry: '🔄 Chơi Lại'
            },
            es: {
                appTitle: 'Aprender', appSub: 'Mundo Mágico',
                switchProfile: '⬅️ Cambiar Perfil', settings: '⚙️ Ajustes',
                timerTitle: 'Temporizador', timerSub: 'Turnos justos para todos', btnStart: 'Iniciar', btnPause: 'Pausar', btnResume: 'Continuar',
                games: { alpha: 'Alfabeto', memory: 'Memoria', desc: 'Describir', slice: 'Cortar', convo: 'Charlar' },
                mapTitle: '📚 Mapa de Aprendizaje',
                exit: '⬅️ Salir', next: 'Siguiente ➡️',
                reportTitle: '¡Nivel Completado!', reportStars: 'Estrellas:', reportWords: 'Palabras:',
                btnNewWords: '🔄 Palabras Nuevas', btnNextLevel: '⬆️ Siguiente Nivel', btnHome: '🏠 Inicio',
                memTitle: '🧠 Memoria de Parejas', memPairs: 'Parejas', memWin: '🎉 ¡Excelente!', memRetry: '🔄 Jugar de Nuevo'
            }
        };

        const TOPICS = [
            {
                id: 'animals', vi: 'Động Vật', es: 'Animales', emoji: '🦁',
                levels: {
                    1: [
                        { vi: 'Chó', es: 'Perro', img: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Mèo', es: 'Gato', img: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Chim', es: 'Pájaro', img: 'https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Cá', es: 'Pez', img: 'https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=600&q=80' }
                    ],
                    2: [
                        { vi: 'Sư tử', es: 'León', img: 'https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Hổ', es: 'Tigre', img: 'https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Rắn', es: 'Serpiente', img: 'https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?auto=format&fit=crop&w=600&q=80' }
                    ]
                }
            },
            {
                id: 'numbers', vi: 'Số Đếm', es: 'Números', emoji: '🔢',
                levels: {
                    1: [
                        { vi: '1 - Một', es: '1 - Uno', img: 'https://placehold.co/600x400/f59e0b/FFF?text=1' },
                        { vi: '2 - Hai', es: '2 - Dos', img: 'https://placehold.co/600x400/f59e0b/FFF?text=2' },
                        { vi: '3 - Ba', es: '3 - Tres', img: 'https://placehold.co/600x400/f59e0b/FFF?text=3' }
                    ],
                    2: [
                        { vi: '10 - Mười', es: '10 - Diez', img: 'https://placehold.co/600x400/10b981/FFF?text=10' },
                        { vi: '20 - Hai mươi', es: '20 - Veinte', img: 'https://placehold.co/600x400/10b981/FFF?text=20' },
                        { vi: '100 - Một trăm', es: '100 - Cien', img: 'https://placehold.co/600x400/10b981/FFF?text=100' }
                    ],
                    3: [
                        { vi: '1 + 1 = 2', es: '1 + 1 = 2', img: 'https://placehold.co/600x400/0ea5e9/FFF?text=1%2B1%3D2' },
                        { vi: '5 - 2 = 3', es: '5 - 2 = 3', img: 'https://placehold.co/600x400/0ea5e9/FFF?text=5-2%3D3' }
                    ]
                }
            },
            {
                id: 'food', vi: 'Ẩm Thực', es: 'Comida', emoji: '🍎',
                levels: {
                    1: [
                        { vi: 'Táo', es: 'Manzana', img: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Chuối', es: 'Plátano', img: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=600&q=80' },
                        { vi: 'Bánh mì', es: 'Pan', img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' }
                    ]
                }
            }
        ];

        // ==========================================
        // MODULE 2: REUSABLE LOGIC (AUDIO & CONFETTI)
        // ==========================================
        
        const playAudio = (text, langCode) => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = langCode;
                window.speechSynthesis.speak(utt);
            }
        };

        const fireConfetti = () => {
            if (window.confetti) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        };

        // ==========================================
        // MODULE 3: COMPONENTS (SCREENS)
        // ==========================================

        const LessonScreen = ({ topic, level, lang, goBack, addStars }) => {
            const words = topic.levels[level];
            const [idx, setIdx] = useState(0);
            const [showReport, setShowReport] = useState(false);
            const t = UI_TEXT[lang];
            const langCode = lang === 'es' ? 'es-ES' : 'vi-VN';
            const word = words[idx];

            useEffect(() => { if (word) playAudio(word[lang], langCode); }, [idx, word, langCode, lang]);

            const handleNext = () => {
                if (idx < words.length - 1) {
                    setIdx(idx + 1);
                } else {
                    fireConfetti();
                    addStars(topic.id, level, 5);
                    setShowReport(true);
                }
            };

            if (showReport) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-[80vh] w-full max-w-md mx-auto pop-in">
                        <div className="bg-white rounded-[3rem] p-8 w-full border-4 border-amber-300 shadow-2xl text-center">
                            <span className="text-7xl mb-4 block floating">🏆</span>
                            <h3 className="text-3xl font-black text-amber-900 mb-2">{t.reportTitle}</h3>
                            <p className="text-amber-600 font-black mb-6">+5 ⭐</p>
                            <div className="flex flex-col gap-3">
                                <button onClick={() => { setIdx(0); setShowReport(false); }} className="btn-3d py-4 bg-blue-500 text-white font-black rounded-2xl">{t.btnNewWords}</button>
                                <button onClick={goBack} className="btn-3d py-4 bg-amber-500 text-white font-black rounded-2xl">{t.btnHome}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center w-full max-w-md mx-auto pt-8">
                    <div className="w-full flex justify-between items-center mb-6">
                        <button onClick={goBack} className="btn-3d px-4 py-2 bg-white rounded-xl font-bold text-gray-800">{t.exit}</button>
                        <span className="font-black text-amber-800 bg-amber-100 px-4 py-1.5 rounded-full">{topic[lang]} • L{level} ({idx+1}/{words.length})</span>
                    </div>

                    <div onClick={() => playAudio(word[lang], langCode)} className="btn-3d bg-white border-4 border-amber-300 rounded-[3rem] p-6 w-full flex flex-col items-center shadow-xl mb-8">
                        <img src={word.img} className="w-full h-64 object-cover rounded-3xl mb-6 shadow-inner" alt="card" />
                        <h2 className="text-4xl font-black text-gray-800">{word[lang]}</h2>
                    </div>

                    <div className="w-full flex flex-col items-center gap-4">
                        <button onClick={() => playAudio(word[lang], langCode)} className="btn-3d w-20 h-20 bg-red-500 text-white rounded-full text-3xl">🔊</button>
                        <button onClick={handleNext} className="btn-3d w-full py-4 bg-amber-500 text-white font-black text-xl rounded-2xl">{t.next}</button>
                    </div>
                </div>
            );
        };

        const MemoryGame = ({ lang, goBack }) => {
            const t = UI_TEXT[lang];
            const langCode = lang === 'es' ? 'es-ES' : 'vi-VN';
            const [deck, setDeck] = useState([]);
            const [matches, setMatches] = useState(0);
            const [firstCard, setFirstCard] = useState(null);
            const [lock, setLock] = useState(false);
            const pairsCount = 4;

            useEffect(() => {
                startNewGame();
            }, [lang]);

            const startNewGame = () => {
                const pool = TOPICS[0].levels[1]; // Using Animals L1
                const subset = [...pool].sort(() => 0.5 - Math.random()).slice(0, pairsCount);
                let newDeck = [];
                subset.forEach((item, index) => {
                    newDeck.push({ id: index, type: 'text', content: item[lang], matchId: item.vi });
                    newDeck.push({ id: index + pairsCount, type: 'img', content: item.img, matchId: item.vi });
                });
                newDeck.sort(() => 0.5 - Math.random());
                setDeck(newDeck.map(c => ({ ...c, flipped: false, matched: false })));
                setMatches(0);
                setFirstCard(null);
                setLock(false);
            };

            const handleFlip = (cardIndex) => {
                if (lock) return;
                const card = deck[cardIndex];
                if (card.flipped || card.matched) return;

                const newDeck = [...deck];
                newDeck[cardIndex].flipped = true;
                setDeck(newDeck);
                
                if (card.type === 'text') playAudio(card.content, langCode);

                if (!firstCard) {
                    setFirstCard({ ...card, index: cardIndex });
                } else {
                    setLock(true);
                    if (firstCard.matchId === card.matchId) {
                        playAudio(lang === 'es' ? '¡Excelente!' : 'Tuyệt vời!', langCode);
                        fireConfetti();
                        setTimeout(() => {
                            const matchedDeck = [...newDeck];
                            matchedDeck[firstCard.index].matched = true;
                            matchedDeck[cardIndex].matched = true;
                            setDeck(matchedDeck);
                            setMatches(m => m + 1);
                            setFirstCard(null);
                            setLock(false);
                        }, 500);
                    } else {
                        setTimeout(() => {
                            const resetDeck = [...newDeck];
                            resetDeck[firstCard.index].flipped = false;
                            resetDeck[cardIndex].flipped = false;
                            setDeck(resetDeck);
                            setFirstCard(null);
                            setLock(false);
                        }, 1000);
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-xl mx-auto pt-4 pop-in">
                    <div className="w-full flex justify-between items-center mb-6">
                        <button onClick={goBack} className="btn-3d px-4 py-2 bg-white rounded-xl font-bold text-gray-800">{t.exit}</button>
                        <span className="font-black text-white bg-purple-600 px-4 py-1.5 rounded-full">{t.memPairs}: {matches}/{pairsCount}</span>
                    </div>
                    
                    <div className="bg-white rounded-[3rem] p-6 sm:p-8 w-full border-8 border-purple-300 shadow-2xl">
                        <h3 className="text-2xl font-black text-purple-900 text-center mb-6">{t.memTitle}</h3>
                        
                        {matches === pairsCount ? (
                            <div className="text-center pop-in">
                                <h4 className="text-3xl font-black text-purple-800 mb-6">{t.memWin}</h4>
                                <button onClick={startNewGame} className="btn-3d w-full py-4 bg-purple-600 text-white font-black rounded-xl">{t.memRetry}</button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                {deck.map((card, idx) => (
                                    <div 
                                        key={idx} 
                                        onClick={() => handleFlip(idx)} 
                                        className={`btn-3d h-32 rounded-2xl flex items-center justify-center text-xl font-black cursor-pointer border-4 border-purple-400 p-2 text-center overflow-hidden ${card.matched ? 'bg-emerald-200 opacity-50' : card.flipped ? 'bg-white text-purple-900' : 'bg-purple-200'}`}
                                    >
                                        {card.flipped || card.matched ? (
                                            card.type === 'img' ? <img src={card.content} className="w-full h-full object-cover rounded-xl"/> : <span>{card.content}</span>
                                        ) : '❓'}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // MODULE 4: MAIN APP CONTAINER
        // ==========================================

        const App = () => {
            // State
            const [screen, setScreen] = useState('profiles'); // profiles, dash, lesson, memory
            const [profiles, setProfiles] = useState(() => JSON.parse(localStorage.getItem('vuihoc_react_v1')) || [
                { id: '1', name: 'Bé An', emoji: '👦', lang: 'vi', stars: 10, progress: {} }
            ]);
            const [activeProfileId, setActiveProfileId] = useState(null);
            const [globalLang, setGlobalLang] = useState('vi');
            
            // Lesson State
            const [lessonTarget, setLessonTarget] = useState({ topic: null, level: 1 });

            // Derived
            const profile = profiles.find(p => p.id === activeProfileId) || profiles[0];
            const t = UI_TEXT[globalLang];

            // Helpers
            const saveToLocal = (newProfiles) => {
                setProfiles(newProfiles);
                localStorage.setItem('vuihoc_react_v1', JSON.stringify(newProfiles));
            };

            const addStars = (topicId, lvl, amount) => {
                if(!activeProfileId) return;
                const newProfs = profiles.map(p => {
                    if(p.id !== activeProfileId) return p;
                    const prog = { ...p.progress };
                    if(!prog[topicId]) prog[topicId] = {};
                    if(!prog[topicId][lvl]) {
                        prog[topicId][lvl] = true;
                        p.stars += amount;
                    }
                    return { ...p, progress: prog, stars: p.stars };
                });
                saveToLocal(newProfs);
            };

            const handleProfileSelect = (p) => {
                setActiveProfileId(p.id);
                setGlobalLang(p.lang);
                setScreen('dash');
            };

            // Routing
            if (screen === 'profiles') {
                return (
                    <div className="w-full max-w-4xl flex flex-col items-center justify-center text-center mt-12 pop-in">
                        <div className="flex gap-2 absolute top-4 right-4">
                            <button onClick={() => setGlobalLang('vi')} className={`btn-3d px-4 py-2 font-black rounded-xl ${globalLang==='vi'?'bg-amber-500 text-white':'bg-white text-gray-700'}`}>VI</button>
                            <button onClick={() => setGlobalLang('es')} className={`btn-3d px-4 py-2 font-black rounded-xl ${globalLang==='es'?'bg-amber-500 text-white':'bg-white text-gray-700'}`}>ES</button>
                        </div>
                        
                        <div className="text-7xl mb-4 floating">🪷</div>
                        <h1 className="text-5xl sm:text-7xl font-game text-amber-600 mb-2">{t.appTitle}</h1>
                        <p className="text-lg text-gray-500 font-bold mb-10 uppercase tracking-widest">{t.appSub}</p>
                        
                        <div className="flex flex-wrap justify-center gap-6 w-full mb-10">
                            {profiles.map(p => (
                                <div key={p.id} onClick={() => handleProfileSelect(p)} className="btn-3d w-48 h-56 bg-white/95 backdrop-blur-md rounded-[2.5rem] border-4 border-amber-300 shadow-xl flex flex-col items-center justify-center p-6 cursor-pointer">
                                    <span className="text-6xl mb-3">{p.emoji}</span>
                                    <h2 className="text-xl font-black text-gray-800 mb-2">{p.name}</h2>
                                    <span className="text-amber-600 font-black text-sm bg-amber-50 px-3 py-1 rounded-full border border-amber-200">⭐ {p.stars}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (screen === 'dash') {
                return (
                    <div className="w-full max-w-4xl flex flex-col items-center pb-24 mt-4 pop-in">
                        <div className="w-full flex justify-between items-center p-4 bg-white/95 rounded-3xl shadow-lg border-2 border-amber-200 mb-6">
                            <button onClick={() => setScreen('profiles')} className="btn-3d px-4 py-2 bg-amber-100 text-amber-900 font-extrabold rounded-2xl text-sm">{t.switchProfile}</button>
                            <div className="flex items-center gap-3">
                                <span className="text-3xl bg-amber-100 p-2 rounded-2xl">{profile.emoji}</span>
                                <div className="text-left">
                                    <div className="font-black text-xl text-gray-800">{profile.name}</div>
                                    <div className="text-amber-600 font-black text-sm">⭐ {profile.stars}</div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setGlobalLang('vi')} className={`px-3 py-1.5 rounded-xl text-sm font-black ${globalLang==='vi'?'bg-amber-500 text-white':'bg-gray-100 text-gray-700'}`}>VI</button>
                                <button onClick={() => setGlobalLang('es')} className={`px-3 py-1.5 rounded-xl text-sm font-black ${globalLang==='es'?'bg-amber-500 text-white':'bg-gray-100 text-gray-700'}`}>ES</button>
                            </div>
                        </div>

                        {/* Arcade Bar */}
                        <div className="grid grid-cols-2 gap-4 w-full mb-8">
                            <button onClick={() => setScreen('memory')} className="btn-3d py-5 bg-purple-600 text-white font-black text-lg rounded-3xl flex items-center justify-center gap-3">
                                <span className="text-4xl floating">🧠</span> {t.games.memory}
                            </button>
                            <button onClick={() => alert("Chức năng đang được cập nhật! (Coming soon!)")} className="btn-3d py-5 bg-teal-600 text-white font-black text-lg rounded-3xl flex items-center justify-center gap-3">
                                <span className="text-4xl floating">🖼️</span> {t.games.desc}
                            </button>
                        </div>

                        {/* Curriculum Roadmap */}
                        <div className="w-full space-y-6">
                            <h2 className="text-3xl font-black text-amber-900 text-center mb-6 bg-white/50 py-2 rounded-full backdrop-blur-sm"><span>📚</span> {t.mapTitle}</h2>
                            {TOPICS.map(topic => (
                                <div key={topic.id} className="w-full p-6 rounded-[2.5rem] bg-white border-4 border-amber-200 shadow-xl flex flex-col items-center mb-6">
                                    <div className="flex items-center gap-3 mb-6 bg-amber-50 px-6 py-2 rounded-full border border-amber-300">
                                        <span className="text-3xl">{topic.emoji}</span>
                                        <h3 className="text-xl font-black text-gray-800">{topic[globalLang]}</h3>
                                    </div>
                                    <div className="flex flex-wrap justify-center gap-3 w-full">
                                        {Object.keys(topic.levels).map(lvl => {
                                            const isDone = profile.progress[topic.id]?.[lvl];
                                            return (
                                                <button key={lvl} onClick={() => { setLessonTarget({topic, level: lvl}); setScreen('lesson'); }} 
                                                    className={`btn-3d w-16 h-16 rounded-2xl flex flex-col items-center justify-center relative shadow-md ${isDone?'bg-emerald-500 text-white':'bg-amber-400 text-white'}`}>
                                                    {isDone && <span className="absolute -top-2 -right-2 text-sm pop-in">⭐</span>}
                                                    <span className="font-black text-xl">L{lvl}</span>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (screen === 'lesson') {
                return <LessonScreen topic={lessonTarget.topic} level={lessonTarget.level} lang={globalLang} goBack={() => setScreen('dash')} addStars={addStars} />;
            }

            if (screen === 'memory') {
                return <MemoryGame lang={globalLang} goBack={() => setScreen('dash')} />;
            }

            return null;
        };

        // Initialize React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
```eof
