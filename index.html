<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vui Học">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>">
    
    <title>Vui Học - Thế Giới Ngôn Ngữ Kỳ Diệu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #f59e0b; --primary-dark: #d97706; --bg-light: #fdfaf6; }
        body {
            font-family: 'Nunito', system-ui, sans-serif !important;
            background-color: var(--bg-light); color: #1f2937;
            overflow-x: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        h1, h2, h3, .font-game { font-family: 'Nunito', sans-serif !important; font-weight: 900; letter-spacing: 0.5px; }
        .cultural-bg {
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px), radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 50px 50px; background-position: 0 0, 25px 25px;
        }
        body.dark-mode { background-color: #0f172a !important; color: #f8fafc !important; }
        body.dark-mode .cultural-bg { background-image: radial-gradient(#334155 2px, transparent 2px), radial-gradient(#334155 2px, transparent 2px); }
        body.dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f1f5f9 !important; }
        body.dark-mode .text-gray-800, body.dark-mode .text-gray-700 { color: #f8fafc !important; }

        .btn-3d {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 0px rgba(0,0,0,0.15), 0 15px 20px rgba(0,0,0,0.1);
            transform: translateY(0); cursor: pointer; touch-action: manipulation;
        }
        .btn-3d:active {
            transform: translateY(8px) !important; box-shadow: 0 0px 0px rgba(0,0,0,0.15), 0 5px 5px rgba(0,0,0,0.1) !important;
        }
        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>

        function speak(text, forceLang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const lCode = forceLang || (STATE.lang === 'es' ? 'es-ES' : 'vi-VN');
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = lCode;
                window.speechSynthesis.speak(utt);
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 130, spread: 90, origin: { y: 0.6 } });
            }
        }

        const ALPHABET = {

                { char: 'A', word: 'Áo' }, { char: 'Ă', word: 'Ăn' }, { char: 'Â', word: 'Ấm' },
                { char: 'B', word: 'Bóng' }, { char: 'C', word: 'Cá' }, { char: 'D', word: 'Dép' },

                { char: 'P', word: 'Perro' }, { char: 'Q', word: 'Queso' }, { char: 'R', word: 'Ratón' }
            ]
        };

        const DESCRIBE_QUESTIONS = {
            vi: [
                { emoji: '🐶', text: 'Con chó màu vàng đang vẫy đuôi.', prompt: 'Con vật trong tranh là gì?', options: ['Con chó', 'Con mèo', 'Con chim'], correct: 0 },
                { emoji: '🍎', text: 'Quả táo đỏ mọng trên cành cây.', prompt: 'Đây là loại quả gì?', options: ['Quả táo', 'Quả chuối', 'Quả cam'], correct: 0 },
                { emoji: '🚗', text: 'Chiếc ô tô màu đỏ chạy trên đường.', prompt: 'Phương tiện này là gì?', options: ['Xe ô tô', 'Xe đạp', 'Tàu hỏa'], correct: 0 }
            ],
            es: [
                { emoji: '🐶', text: 'El perro marrón mueve su cola.', prompt: '¿Qué animal aparece en la imagen?', options: ['El perro', 'El gato', 'El pájaro'], correct: 0 },
                { emoji: '🍎', text: 'La manzana roja cuelga del árbol.', prompt: '¿Qué fruta es esta?', options: ['La manzana', 'El plátano', 'La uva'], correct: 0 },
                { emoji: '🚗', text: 'El coche rojo viaja por la calle.', prompt: '¿Qué vehículo es este?', options: ['El coche', 'La bicicleta', 'El avión'], correct: 0 }
            ]
        };

        // --- RENDER ENGINE ---
        function render() {
            const root = document.getElementById('app');
            root.innerHTML = '';

            if (STATE.screen === 'profiles') {
                root.innerHTML = renderProfilesScreen();
            } else if (STATE.screen === 'dashboard') {
                root.innerHTML = renderDashboardScreen();
            } else if (STATE.screen === 'lesson') {
                root.innerHTML = renderLessonScreen();
            } else if (STATE.screen === 'alphabet') {
                root.innerHTML = renderAlphabetScreen();
            } else if (STATE.screen === 'describe') {
                root.innerHTML = renderDescribeScreen();
            } else if (STATE.screen === 'memory') {
                root.innerHTML = renderMemoryScreen();
            } else if (STATE.screen === 'slicer') {
                root.innerHTML = renderSlicerScreen();
                initSlicerCanvas();
            }

            // Render Modals
            if (STATE.showSettings) root.innerHTML += renderSettingsModal();
            if (STATE.showEditProfile) root.innerHTML += renderEditProfileModal();
            if (STATE.showReport) root.innerHTML += renderReportModal();
        }

        // --- SCREENS ---
        function renderProfilesScreen() {
            return `
                <div class="w-full flex flex-col items-center justify-center text-center mt-12">
                    <div class="text-6xl mb-4 floating">🪷</div>
                    <h1 class="text-5xl font-game text-amber-600 mb-2">Vui Học</h1>
                    <p class="text-lg text-gray-500 font-bold mb-8 uppercase tracking-wider">Thế Giới Ngôn Ngữ Kỳ Diệu</p>
                    
                    <div class="flex flex-wrap justify-center gap-6 w-full mb-8">
                        ${STATE.profiles.map(p => `
                            <div onclick="selectProfile('${p.id}')" class="w-56 h-64 bg-white/95 backdrop-blur-md rounded-[2.5rem] border-4 border-amber-300 shadow-xl flex flex-col items-center justify-center p-6 cursor-pointer transform transition-all hover:-translate-y-2 relative group">
                                <button onclick="event.stopPropagation(); openEditProfile('${p.id}')" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-amber-100 flex items-center justify-center text-sm shadow-sm">✏️</button>
                                <span class="text-6xl mb-3">${p.emoji}</span>
                                <h2 class="text-2xl font-black text-gray-800 mb-1">${p.name}</h2>
                                <span class="text-amber-500 font-black text-sm bg-amber-50 px-3 py-1 rounded-full border border-amber-200">⭐ ${p.stars} Stars</span>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="createProfile()" class="btn-3d px-8 py-4 bg-amber-500 text-white font-game text-xl rounded-[2rem] border-4 border-amber-600">➕ Thêm Tên Người Dùng</button>
                    <button onclick="STATE.showSettings = true; render();" class="mt-6 text-sm font-bold text-gray-500 hover:text-amber-600">⚙️ Cài Đặt Chung</button>
                </div>
            `;
        }

        function renderDashboardScreen() {
            const profile = STATE.profiles.find(p => p.id === STATE.currentProfileId) || STATE.profiles[0];
            const t = STATE.lang === 'es' ? {
                switch: '⬅️ Cambiar Perfil', alpha: 'Alfabeto', memory: 'Memoria', describe: 'Describir', slicer: 'Cortar', map: 'Mapa de Aprendizaje (7 Niveles HD)', timer: 'Temporizador'
            } : {
                switch: '⬅️ Đổi Hồ Sơ', alpha: 'Bảng Chữ Cái', memory: 'Lật Hình Cặp', describe: 'Mô Tả Tranh', slicer: 'Chém Từ HD', map: 'Bản Đồ Học Tập Thực Tế (7 Cấp Độ HD)', timer: 'Hẹn Giờ Lượt Chơi'
            };

            return `
                <div class="w-full flex flex-col items-center pb-24">
                    <div class="w-full flex justify-between items-center p-4 bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border-2 border-amber-200 mb-6">
                        <button onclick="STATE.screen = 'profiles'; render();" class="btn-3d px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold rounded-2xl text-sm">${t.switch}</button>
                        
                        <div class="flex items-center gap-3">
                            <span class="text-3xl bg-amber-100 p-2 rounded-2xl shadow-inner">${profile.emoji}</span>
                            <div class="text-left">
                                <div class="font-black text-xl text-gray-800">${profile.name}</div>
                                <div class="text-amber-600 font-black text-sm">⭐ <span>${profile.stars}</span> Stars</div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <div class="flex bg-amber-100 rounded-2xl p-1 border border-amber-200">
                                <button onclick="toggleLang('vi')" class="px-3 py-1.5 rounded-xl text-sm font-black transition-colors ${STATE.lang==='vi'?'bg-amber-500 text-white shadow-sm':'text-gray-700'}">VI</button>
                                <button onclick="toggleLang('es')" class="px-3 py-1.5 rounded-xl text-sm font-black transition-colors ${STATE.lang==='es'?'bg-amber-500 text-white shadow-sm':'text-gray-700'}">ES</button>
                            </div>
                            <button onclick="STATE.showSettings = true; render();" class="p-2.5 bg-amber-100 hover:bg-amber-200 rounded-2xl text-sm shadow-sm text-gray-800">⚙️</button>
                        </div>
                    </div>

                    <!-- Turn Timer Bar -->
                    <div class="w-full bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-md border-2 border-amber-200 mb-6 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">⏳</span>
                            <div>
                                <div class="font-black text-gray-800 text-sm">${t.timer}</div>
                                <div class="text-xs text-gray-500 font-bold">Phiên chơi công bằng cho các bé</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-black text-xl text-amber-600 bg-amber-50 px-4 py-1.5 rounded-2xl border border-amber-200">${Math.floor(STATE.timerSeconds/60)}:${(STATE.timerSeconds%60).toString().padStart(2,'0')}</span>
                            <button onclick="toggleTimer()" class="px-4 py-2 bg-emerald-500 text-white font-black rounded-2xl text-sm shadow-md">${STATE.timerRunning ? 'Tạm Dừng' : 'Bắt Đầu'}</button>
                            <button onclick="STATE.timerSeconds=120; render();" class="px-3 py-2 bg-gray-100 text-gray-700 font-black rounded-2xl text-sm">🔄</button>
                        </div>
                    </div>

                    <!-- Arcade Buttons -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full mb-8">
                        <button onclick="openAlphabet()" class="btn-3d py-4 bg-amber-500 text-white font-black text-base rounded-3xl flex flex-col items-center"><span class="text-3xl mb-1">🔤</span> ${t.alpha}</button>

        function startMemory(pairs = 4) {
            STATE.memoryPairs = pairs;
            STATE.memoryMatches = 0;
            STATE.memoryDone = false;
            const pool = TOPICS[0].levels[1];
            const subset = [...pool].sort(() => 0.5 - Math.random()).slice(0, pairs);
            let deck = [];
            subset.forEach((item, idx) => {
                deck.push({ id: item.vi, display: item[STATE.lang], speak: item[STATE.lang], type: 'text', index: idx * 2 });
                deck.push({ id: item.vi, display: `<img src="${item.img}" class="w-full h-full object-cover rounded-xl"/>`, speak: item[STATE.lang], type: 'img', index: idx * 2 + 1 });
            });
            deck.sort(() => 0.5 - Math.random());
            STATE.memoryDeck = deck.map((c, i) => ({ ...c, index: i, flipped: false, matched: false }));
            STATE.screen = 'memory';
            render();

        function flipMemoryCard(index) {
            const card = STATE.memoryDeck[index];
            if (card.flipped || card.matched) return;
            card.flipped = true;
            speak(card.speak);

            if (!STATE.memoryFirst) {
                STATE.memoryFirst = card;
            } else {
                if (STATE.memoryFirst.id === card.id) {
                    speak(STATE.lang === 'es' ? '¡Muy bien!' : 'Chính xác!');
                    triggerConfetti();
                    STATE.memoryDeck = STATE.memoryDeck.map(c => c.id === card.id ? { ...c, matched: true } : c);
                    STATE.memoryFirst = null;
                    STATE.memoryMatches++;
                    if (STATE.memoryMatches === STATE.memoryPairs) {
                        STATE.memoryDone = true;
                    }
                } else {
                    const prev = STATE.memoryFirst;
                    STATE.memoryFirst = null;
                    setTimeout(() => {
                        STATE.memoryDeck = STATE.memoryDeck.map(c => c.index === card.index || c.index === prev.index ? { ...c, flipped: false } : c);
                        render();
                    }, 800);
                }
            }
            render();
        }

        function startSlicer() {
            STATE.screen = 'slicer';
            STATE.slicerActive = true;
            STATE.slicerScore = 0;
            render();
        }

        function initSlicerCanvas() {
            const canvas = document.getElementById('slicer-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let trail = [];
            let items = [{ emoji: '🍉', word: 'Táo', x: canvas.width / 2, y: canvas.height + 50, vx: 1, vy: -15 }];

            const handleMove = (e) => {
                if (!STATE.slicerActive) return;
                e.preventDefault();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                trail.push({ x, y, age: 0 });

                items.forEach(it => {
                    if (Math.hypot(x - it.x, y - it.y) < 70) {
                        speak(it.word);
                        triggerConfetti();
                        STATE.slicerScore++;
                        const scoreEl = document.getElementById('slicer-score-val');
                        if (scoreEl) scoreEl.innerText = STATE.slicerScore;
                        it.y = -200;
                    }
                });
            };

            canvas.onpointermove = handleMove;
            canvas.ontouchmove = handleMove;

            const loop = () => {
                if (!STATE.slicerActive) return;
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (trail.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
