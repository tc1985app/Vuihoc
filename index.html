    <style>
        :root {
            --primary: #f59e0b; --primary-dark: #d97706; --bg-light: #fdfaf6;
        }
        body {
            font-family: 'Nunito', system-ui, sans-serif !important;
            background-color: var(--bg-light); color: #1f2937;
            overflow-x: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            user-select: none; -webkit-user-select: none;
        }
        h1, h2, h3, .font-game { font-family: 'Nunito', sans-serif !important; font-weight: 900; letter-spacing: 0.5px; }

        .cultural-bg {
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px), radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 50px 50px; background-position: 0 0, 25px 25px;
        }

        .screen-container { transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 1; transform: scale(1); }
        .screen-hidden { opacity: 0 !important; transform: scale(0.95) !important; pointer-events: none; position: absolute; }

        .btn-3d {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 0px rgba(0,0,0,0.15), 0 15px 20px rgba(0,0,0,0.1);
            transform: translateY(0); cursor: pointer; touch-action: manipulation;
        }
        .btn-3d:active {
            transform: translateY(8px); box-shadow: 0 0px 0px rgba(0,0,0,0.15), 0 5px 5px rgba(0,0,0,0.1);
        }

        .floating { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } }

        #confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
        .confetti { position: absolute; width: 12px; height: 24px; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        #balloon-area { position: absolute; inset: 0; z-index: 20; overflow: hidden; pointer-events: none; }
        .balloon-wrapper { position: absolute; cursor: pointer; display: flex; flex-direction: column; align-items: center; animation: floatUp var(--speed) ease-in forwards, wobble 3s ease-in-out infinite alternate; pointer-events: auto; }
        .balloon-body {
            width: 90px; height: 110px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex; align-items: center; justify-content: center; font-size: 2.8rem;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.2);
            position: relative; transition: transform 0.1s;
        }
        .balloon-wrapper:active .balloon-body { transform: scale(0.9); }
        .balloon-body::after { content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 15px solid inherit; filter: brightness(0.8); }
        .balloon-string { width: 2px; height: 60px; background: rgba(255,255,255,0.6); margin: 0 auto; margin-top: 10px; }
        @keyframes floatUp { 0% { bottom: -150px; } 100% { bottom: 120vh; } }
        @keyframes wobble { 0% { margin-left: -20px; } 100% { margin-left: 20px; } }
        .pop-particle { position: absolute; width: 15px; height: 15px; border-radius: 50%; animation: explode 0.5s ease-out forwards; pointer-events: none; }
        @keyframes explode { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        .spell-slot { background: rgba(255,255,255,0.8); box-shadow: inset 0 4px 6px rgba(0,0,0,0.1); }
        .spell-block { cursor: pointer; touch-action: manipulation; transition: all 0.2s; user-select: none; }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
</head>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration, vol=0.1) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        window.playSound = {
            pop: () => { playTone(800, 'sine', 0.1, 0.2); playTone(1200, 'triangle', 0.1, 0.1); },
            slice: () => playTone(600, 'sawtooth', 0.15, 0.05),
            success: () => { playTone(400, 'sine', 0.1, 0.1); setTimeout(()=>playTone(600, 'sine', 0.2, 0.1), 100); setTimeout(()=>playTone(800, 'sine', 0.3, 0.15), 200); },
            blip: () => playTone(500, 'square', 0.05, 0.05),
            error: () => { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(()=>playTone(250, 'sawtooth', 0.2, 0.1), 150); }
        };

        window.speakText = function(txt, forceLang) {
            if(!window.speechSynthesis) return;

            let voices = window.speechSynthesis.getVoices();
            let voice = voices.find(v => v.lang === targetLang) || voices.find(v => v.lang.startsWith(targetLang.split('-')[0]));
            if(voice) utt.voice = voice;
            
            window.speechSynthesis.speak(utt);

        // Slicer
        let slcRun = false, sCtx, sCan, sFruits = [], sParticles = [], sTrail = [], sScore = 0;
        window.startSlicerGame = function() { window.showScreen('slicer'); };
        window.exitSlicer = function() { slcRun = false; window.showScreen('dashboard'); };
        
        function startSlicerCanvas() {
            sCan = document.getElementById('slicer-canvas'); sCtx = sCan.getContext('2d');
            sCan.width = window.innerWidth; sCan.height = window.innerHeight;
            slcRun = true; sScore = 0; sFruits = []; sParticles = []; sTrail = [];
            document.getElementById('slicer-score').innerText = '0';
            
            const handleMove = (e) => {
                if(!slcRun) return; e.preventDefault();
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const y = e.touches ? e.touches[0].clientY : e.clientY;
                sTrail.push({x, y, age: 0});
                
                sFruits.forEach(f => {
                    if(!f.sliced && Math.hypot(x - f.x, y - f.y) < 60) {
                        f.sliced = true; window.playSound.slice(); sScore++; document.getElementById('slicer-score').innerText = sScore;
                        for(let i=0; i<15; i++) sParticles.push({x: f.x, y: f.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, c: `hsl(${Math.random()*360},100%,50%)`});
                    }
                });
            };
            sCan.addEventListener('pointermove', handleMove); sCan.addEventListener('touchmove', handleMove, {passive:false});
            requestAnimationFrame(slicerLoop);
        }

        function slicerLoop() {
            if(!slcRun) return; sCtx.fillStyle = '#0f172a'; sCtx.fillRect(0,0,sCan.width, sCan.height);
            
            if(Math.random() < 0.03) {
                const w = VOCAB_DATABASE[Math.floor(Math.random()*VOCAB_DATABASE.length)];
                sFruits.push({ emoji: w.emoji, x: Math.random()*(sCan.width-100)+50, y: sCan.height+50, vx: (Math.random()-0.5)*6, vy: -(Math.random()*8 + 15), rot: 0, vrot: (Math.random()-0.5)*0.2, sliced: false });
            }

            if(sTrail.length > 0) {
                sCtx.beginPath(); sCtx.moveTo(sTrail[0].x, sTrail[0].y);
                for(let i=1; i<sTrail.length; i++) sCtx.lineTo(sTrail[i].x, sTrail[i].y);
                sCtx.strokeStyle = '#38bdf8'; sCtx.lineWidth = 8; sCtx.lineCap = 'round'; sCtx.lineJoin = 'round';
                sCtx.shadowBlur = 15; sCtx.shadowColor = '#0ea5e9'; sCtx.stroke(); sCtx.shadowBlur = 0;
            }
            sTrail.forEach(t => t.age++); sTrail = sTrail.filter(t => t.age < 10);

            sFruits.forEach((f, i) => {
                f.x += f.vx; f.y += f.vy; f.vy += 0.3; f.rot += f.vrot;
                sCtx.save(); sCtx.translate(f.x, f.y); 
                
                if(f.sliced) {
                    sCtx.globalAlpha = Math.max(0, 1 - (f.vy/20));
                    sCtx.font = "80px Arial"; sCtx.textAlign = 'center'; sCtx.textBaseline='middle';
                    sCtx.translate(-20 - f.vy*2, f.vy); sCtx.rotate(f.rot - 0.5); sCtx.fillText(f.emoji, 0, 0);
                    sCtx.translate(40 + f.vy*4, 0); sCtx.rotate(1); sCtx.fillText(f.emoji, 0, 0);
                } else {
                    sCtx.rotate(f.rot); sCtx.font = "80px Arial"; sCtx.textAlign = 'center'; sCtx.textBaseline='middle'; sCtx.fillText(f.emoji, 0, 0);
                }
                sCtx.restore();
                if(f.y > sCan.height + 150) sFruits.splice(i, 1);
            });

            sParticles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.03;
                sCtx.fillStyle = p.c; sCtx.globalAlpha = p.life;
                sCtx.beginPath(); sCtx.arc(p.x, p.y, 6, 0, Math.PI*2); sCtx.fill();
                if(p.life <= 0) sParticles.splice(i, 1);
            });
            sCtx.globalAlpha = 1;

            requestAnimationFrame(slicerLoop);
        }

        function nextBalloonRound() {

                const bw = document.createElement('div');

                bw.style.left = `${12 + (i*28)}vw`;

                    e.preventDefault();

                        balScore++; document.getElementById('balloon-score').innerText = balScore;
                        
                        const rect = bw.getBoundingClientRect();
                        for(let j=0; j<12; j++) {
                            const p = document.createElement('div'); p.className = 'pop-particle'; p.style.background = color;
                            p.style.left = `${rect.left + 45}px`; p.style.top = `${rect.top + 55}px`;
                            p.style.setProperty('--tx', `${(Math.random()-0.5)*200}px`); p.style.setProperty('--ty', `${(Math.random()-0.5)*200}px`);
                            area.appendChild(p); setTimeout(()=>p.remove(), 500);
                        }
                        bw.remove(); setTimeout(nextBalloonRound, 800);
                    } else {
                        window.playSound.error();
                        bw.classList.add('shake'); setTimeout(()=>bw.classList.remove('shake'), 400);
                    }
                };
                
                bw.addEventListener('pointerdown', handlePop);
                bw.addEventListener('animationend', (e) => { if(e.animationName === 'floatUp') { bw.remove(); if(w.id === balTarget.id && balRun) nextBalloonRound(); } });
                area.appendChild(bw);
            });
        }
        window.playBalloonAudio = () => window.speakText(balTarget[currentLang]);

        // Spelling (Xếp Chữ) - Robust pointerdown handling
        let spellScore = 0, spellTarget = null, spellArr = [], spellIdx = 0;
        window.startSpellingGame = () => { window.showScreen('spelling'); spellScore = 0; document.getElementById('spelling-score').innerText='0'; loadSpellWord(); };
        window.exitSpelling = () => window.showScreen('dashboard');

        function loadSpellWord() {
            spellTarget = VOCAB_DATABASE[Math.floor(Math.random()*VOCAB_DATABASE.length)];
            document.getElementById('spelling-emoji').innerText = spellTarget.emoji;
            spellArr = spellTarget[currentLang].toUpperCase().split('');
            spellIdx = 0;

            const slots = document.getElementById('spelling-slots'); slots.innerHTML = '';
            const bank = document.getElementById('spelling-bank'); bank.innerHTML = '';

            spellArr.forEach((c, i) => {
                const s = document.createElement('div');
                s.className = 'spell-slot w-14 h-16 rounded-2xl flex items-center justify-center text-3xl font-game text-amber-900/35';
                s.innerText = c; s.id = `sslop-${i}`;
                slots.appendChild(s);
            });

            [...spellArr].sort(()=>0.5-Math.random()).forEach((c, i) => {
                const b = document.createElement('div');
                b.className = 'spell-block btn-3d w-14 h-16 bg-amber-400 rounded-2xl flex items-center justify-center text-3xl font-game text-amber-900 border-b-4 border-amber-600';
                b.innerText = c; b.id = `sblk-${i}`;
                
                const handleBlockAction = (e) => {
                    e.preventDefault();
                    if(c === spellArr[spellIdx]) {
                        window.playSound.blip();
                        b.style.visibility = 'hidden';
                        const slot = document.getElementById(`sslop-${spellIdx}`);
                        slot.className = 'spell-slot w-14 h-16 rounded-2xl flex items-center justify-center text-3xl font-game text-white bg-green-500 border-b-4 border-green-700 pop-in';
                        spellIdx++;
                        if(spellIdx >= spellArr.length) {
                            window.playSound.success(); fireConfetti();
                            spellScore++; document.getElementById('spelling-score').innerText = spellScore;
                            setTimeout(loadSpellWord, 1500);
                        }
                    } else {
                        window.playSound.error(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'), 400);
                    }
                };

                b.addEventListener('pointerdown', handleBlockAction);

                bank.appendChild(b);
            });
        }
        window.playSpellingAudio = () => window.speakText(spellTarget[currentLang]);

        // Writing
        let wCanvas, wCtx, isDrawing = false, wTarget = null;
        window.startWritingGame = () => { window.showScreen('writing'); };
        window.exitWriting = () => window.showScreen('dashboard');
        
        function initWritingCanvas() {
            wCanvas = document.getElementById('writing-canvas'); wCtx = wCanvas.getContext('2d');
            const rect = wCanvas.parentElement.getBoundingClientRect(); wCanvas.width = rect.width; wCanvas.height = rect.height;
            
            wCanvas.addEventListener('pointerdown', wStart); wCanvas.addEventListener('pointermove', wDraw);
            window.addEventListener('pointerup', wStop);
            
            window.nextWritingWord();
        }

        window.clearWritingCanvas = function() {
            wCtx.clearRect(0,0,wCanvas.width, wCanvas.height);
            wCtx.strokeStyle = 'rgba(255,255,255,0.1)'; wCtx.lineWidth = 4; wCtx.setLineDash([15, 15]);
            wCtx.beginPath(); wCtx.moveTo(40, wCanvas.height/2); wCtx.lineTo(wCanvas.width-40, wCanvas.height/2); wCtx.stroke(); wCtx.setLineDash([]);
            
            wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle'; wCtx.font = "900 80px 'Nunito'";
            wCtx.fillStyle = 'rgba(255,255,255,0.05)';
            wCtx.fillText(`${wTarget.emoji} ${wTarget[currentLang]}`, wCanvas.width/2, wCanvas.height/2);
        };
        
        window.nextWritingWord = () => { wTarget = VOCAB_DATABASE[Math.floor(Math.random()*VOCAB_DATABASE.length)]; window.clearWritingCanvas(); };
        window.finishWritingWord = () => { window.playSound.success(); fireConfetti(); window.nextWritingWord(); };

        function wStart(e) { e.preventDefault(); isDrawing = true; const r = wCanvas.getBoundingClientRect(); wCtx.beginPath(); wCtx.moveTo(e.clientX-r.left, e.clientY-r.top); }
        function wDraw(e) {
            if(!isDrawing) return; e.preventDefault(); const r = wCanvas.getBoundingClientRect();
            wCtx.lineTo(e.clientX-r.left, e.clientY-r.top);
            wCtx.strokeStyle = '#2dd4bf'; wCtx.lineWidth = 15; wCtx.lineCap = 'round'; wCtx.lineJoin = 'round';
            wCtx.shadowBlur = 20; wCtx.shadowColor = '#14b8a6'; wCtx.stroke();
        }
        function wStop() { isDrawing = false; }

        window.addEventListener('DOMContentLoaded', loadProfiles);
    </script>
</body>
</html>
